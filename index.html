<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selectum Noa Belek — Zeya AI</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#173d52 0,#08131d 45%,#050a10 100%);
    color:white;
}

.app{
    width:100%;
    max-width:850px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    padding:20px 16px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(4,12,18,.75);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:.5px;
}

.hotel{
    margin-top:5px;
    font-size:15px;
    opacity:.75;
}

.status{
    margin-top:8px;
    font-size:13px;
    color:#7ee7c6;
}

/* LANGUAGE */

.language-box{
    padding:12px 16px 0;
}

select{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:#101d27;
    color:white;
    font-size:15px;
}

/* WELCOME */

.welcome{
    padding:22px 16px 8px;
}

.welcome h1{
    margin:0;
    font-size:25px;
}

.welcome p{
    margin:8px 0 0;
    opacity:.75;
    line-height:1.5;
}

/* QUICK BUTTONS */

.quick{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 16px;
}

.quick button{
    white-space:nowrap;
    border:1px solid rgba(255,255,255,.12);
    background:#10202b;
    color:white;
    border-radius:20px;
    padding:10px 14px;
    cursor:pointer;
}

.quick button:active{
    transform:scale(.97);
}

/* CHAT */

.chat{
    flex:1;
    padding:10px 16px 120px;
    overflow-y:auto;
}

.message{
    max-width:85%;
    margin:10px 0;
    padding:13px 15px;
    border-radius:17px;
    line-height:1.45;
    white-space:pre-wrap;
}

.bot{
    background:#122631;
    border-bottom-left-radius:5px;
}

.user{
    margin-left:auto;
    background:#176b63;
    border-bottom-right-radius:5px;
}

/* TYPING */

.typing{
    display:none;
    opacity:.65;
    font-size:14px;
    padding:5px 5px 12px;
}

/* VOICE */

.voice-area{
    padding:0 16px 10px;
}

.voice-button{
    width:100%;
    padding:13px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:#101f2a;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.voice-button.enabled{
    background:#164c45;
    border-color:#3ac9a4;
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:850px;
    margin:auto;
    padding:10px 12px 14px;
    background:rgba(4,10,15,.94);
    backdrop-filter:blur(18px);
    display:flex;
    gap:8px;
    border-top:1px solid rgba(255,255,255,.1);
}

.input-area input{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:#101b24;
    color:white;
    outline:none;
    font-size:15px;
}

.input-area button{
    width:48px;
    border:0;
    border-radius:14px;
    background:#18796c;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.mic{
    background:#273746 !important;
}

/* CLEAR */

.clear{
    text-align:center;
    padding:4px 16px 10px;
}

.clear button{
    border:0;
    background:none;
    color:#aaa;
    cursor:pointer;
    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:24px;
    }

    .hotel{
        font-size:13px;
    }

    .welcome h1{
        font-size:22px;
    }

    .message{
        max-width:90%;
    }

}

</style>
</head>


<body>

<div class="app">

<header>

    <div class="logo">
        🤖 Zeya AI
    </div>

    <div class="hotel">
        Selectum Noa Belek
    </div>

    <div class="status" id="status">
        AI Concierge
    </div>

</header>


<div class="language-box">

<select id="language">

    <option value="tr">🇹🇷 Türkçe</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="en">🇬🇧 English</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="fr">🇫🇷 Français</option>
    <option value="es">🇪🇸 Español</option>
    <option value="it">🇮🇹 Italiano</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="uk">🇺🇦 Українська</option>
    <option value="pl">🇵🇱 Polski</option>

</select>

</div>


<section class="welcome">

    <h1 id="welcomeTitle">
        Hoş geldiniz! 👋
    </h1>

    <p id="welcomeText">
        Ben Zeya, Selectum Noa Belek AI asistanınızım.
        Oteliniz hakkında size yardımcı olabilirim.
    </p>

</section>


<div class="quick">

    <button onclick="quickQuestion('Restoranlar saat kaçta açılıyor?')">
        🍽️ Restoranlar
    </button>

    <button onclick="quickQuestion('Kahvaltı saat kaçta?')">
        🍳 Kahvaltı
    </button>

    <button onclick="quickQuestion('Akşam yemeği saat kaçta?')">
        🌙 Akşam yemeği
    </button>

    <button onclick="quickQuestion('SPA hakkında bilgi verir misiniz?')">
        💆 SPA
    </button>

    <button onclick="quickQuestion('Otelde hangi aktiviteler var?')">
        🎯 Aktiviteler
    </button>

</div>


<div class="chat" id="chat"></div>

<div class="typing" id="typing">
    Zeya düşünüyor... 🤖
</div>


<div class="voice-area">

    <button
        class="voice-button"
        id="voiceButton"
        onclick="enableVoice()"
    >
        🔊 Zeya'nın sesini aç
    </button>

</div>


<div class="clear">

    <button onclick="clearChat()">
        🗑️ Sohbeti temizle
    </button>

</div>


<div class="input-area">

    <button
        class="mic"
        onclick="startVoice()"
        id="micButton"
    >
        🎙️
    </button>

    <input
        id="input"
        type="text"
        placeholder="Zeya'ya bir soru sorun..."
        autocomplete="off"
    >

    <button onclick="sendMessage()">
        ➤
    </button>

</div>

</div>


<script>

/* =========================
   API
========================= */

const API_URL =
    "https://zeya-pi.vercel.app/api/chat";

const TTS_URL =
    "https://zeya-pi.vercel.app/api/tts";


/* =========================
   ELEMENTS
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const language =
    document.getElementById("language");

const typing =
    document.getElementById("typing");

const status =
    document.getElementById("status");

const voiceButton =
    document.getElementById("voiceButton");

const micButton =
    document.getElementById("micButton");


/* =========================
   VOICE
========================= */

let voiceEnabled = false;

let audio = new Audio();

audio.preload = "auto";


/* =========================
   LANGUAGE TEXT
========================= */

const langData = {

    tr:{
        welcome:"Hoş geldiniz! 👋",
        text:"Ben Zeya, Selectum Noa Belek AI asistanınızım. Oteliniz hakkında size yardımcı olabilirim.",
        placeholder:"Zeya'ya bir soru sorun...",
        voice:"🔊 Zeya'nın sesini aç",
        enabled:"🔊 Zeya'nın sesi açık",
        thinking:"Zeya düşünüyor... 🤖",
        listening:"🎙️ Sizi dinliyorum..."
    },

    ru:{
        welcome:"Добро пожаловать! 👋",
        text:"Я Зея, AI-консьерж Selectum Noa Belek. Я помогу вам с вопросами об отеле.",
        placeholder:"Задайте вопрос Зее...",
        voice:"🔊 Включить голос Зеи",
        enabled:"🔊 Голос Зеи включён",
        thinking:"Зея думает... 🤖",
        listening:"🎙️ Я слушаю..."
    },

    en:{
        welcome:"Welcome! 👋",
        text:"I'm Zeya, the Selectum Noa Belek AI concierge. I can help you with questions about the hotel.",
        placeholder:"Ask Zeya a question...",
        voice:"🔊 Turn on Zeya's voice",
        enabled:"🔊 Zeya's voice is on",
        thinking:"Zeya is thinking... 🤖",
        listening:"🎙️ I'm listening..."
    },

    de:{
        welcome:"Willkommen! 👋",
        text:"Ich bin Zeya, der AI-Concierge des Selectum Noa Belek.",
        placeholder:"Frage an Zeya...",
        voice:"🔊 Zeyas Stimme einschalten",
        enabled:"🔊 Zeyas Stimme ist aktiv",
        thinking:"Zeya denkt nach... 🤖",
        listening:"🎙️ Ich höre zu..."
    },

    fr:{
        welcome:"Bienvenue ! 👋",
        text:"Je suis Zeya, votre concierge IA du Selectum Noa Belek.",
        placeholder:"Posez une question à Zeya...",
        voice:"🔊 Activer la voix de Zeya",
        enabled:"🔊 La voix de Zeya est activée",
        thinking:"Zeya réfléchit... 🤖",
        listening:"🎙️ Je vous écoute..."
    },

    es:{
        welcome:"¡Bienvenido! 👋",
        text:"Soy Zeya, la asistente de IA del Selectum Noa Belek.",
        placeholder:"Haz una pregunta a Zeya...",
        voice:"🔊 Activar la voz de Zeya",
        enabled:"🔊 La voz de Zeya está activa",
        thinking:"Zeya está pensando... 🤖",
        listening:"🎙️ Te escucho..."
    },

    it:{
        welcome:"Benvenuti! 👋",
        text:"Sono Zeya, l'assistente AI del Selectum Noa Belek.",
        placeholder:"Fai una domanda a Zeya...",
        voice:"🔊 Attiva la voce di Zeya",
        enabled:"🔊 La voce di Zeya è attiva",
        thinking:"Zeya sta pensando... 🤖",
        listening:"🎙️ Ti ascolto..."
    },

    ar:{
        welcome:"مرحباً بكم! 👋",
        text:"أنا زيا، المساعدة الذكية في Selectum Noa Belek.",
        placeholder:"اسأل زيا سؤالاً...",
        voice:"🔊 تشغيل صوت زيا",
        enabled:"🔊 صوت زيا يعمل",
        thinking:"زيا تفكر... 🤖",
        listening:"🎙️ أنا أستمع..."
    },

    uk:{
        welcome:"Ласкаво просимо! 👋",
        text:"Я Зея, AI-консьєрж Selectum Noa Belek.",
        placeholder:"Поставте запитання Зеї...",
        voice:"🔊 Увімкнути голос Зеї",
        enabled:"🔊 Голос Зеї увімкнено",
        thinking:"Зея думає... 🤖",
        listening:"🎙️ Я слухаю..."
    },

    pl:{
        welcome:"Witamy! 👋",
        text:"Jestem Zeya, asystentką AI hotelu Selectum Noa Belek.",
        placeholder:"Zadaj pytanie Zeyi...",
        voice:"🔊 Włącz głos Zeyi",
        enabled:"🔊 Głos Zeyi jest włączony",
        thinking:"Zeya myśli... 🤖",
        listening:"🎙️ Słucham..."
    }

};


/* =========================
   LANGUAGE CHANGE
========================= */

language.addEventListener(
    "change",
    function(){

        const data =
            langData[language.value] ||
            langData.tr;

        document.getElementById(
            "welcomeTitle"
        ).textContent =
            data.welcome;

        document.getElementById(
            "welcomeText"
        ).textContent =
            data.text;

        input.placeholder =
            data.placeholder;

        if(!voiceEnabled){

            voiceButton.textContent =
                data.voice;

        }else{

            voiceButton.textContent =
                data.enabled;

        }

        typing.textContent =
            data.thinking;

    }
);


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    type
){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   SEND
========================= */

async function sendMessage(){

    const message =
        input.value.trim();

    if(!message){
        return;
    }

    addMessage(
        message,
        "user"
    );

    input.value = "";

    typing.style.display =
        "block";

    status.textContent =
        "Zeya AI";


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        message:message,

                        language:
                            language.value

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "API error"
            );

        }


        const reply =
            data.reply ||
            "Üzgünüm, cevap alınamadı.";


        addMessage(
            reply,
            "bot"
        );


        if(voiceEnabled){

            speak(reply);

        }


    }catch(error){

        console.error(
            "CHAT ERROR:",
            error
        );

        addMessage(
            "Bağlantıda bir sorun oluştu. Lütfen tekrar deneyin.",
            "bot"
        );

    }


    typing.style.display =
        "none";
}


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   QUICK QUESTION
========================= */

function quickQuestion(
    question
){

    input.value =
        question;

    sendMessage();

}


/* =========================
   OPENAI TTS
========================= */

async function speak(text){

    if(!voiceEnabled){
        return;
    }

    try{

        const response =
            await fetch(
                TTS_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        language:
                            language.value

                    })
                }
            );


        if(!response.ok){

            throw new Error(
                "TTS error"
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        audio.pause();

        audio.src =
            url;

        audio.currentTime =
            0;

        await audio.play();


        audio.onended =
            function(){

                URL.revokeObjectURL(
                    url
                );

            };


    }catch(error){

        console.error(
            "TTS ERROR:",
            error
        );


        /* fallback */

        if(
            "speechSynthesis"
            in window
        ){

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );

            utterance.lang =
                language.value === "tr"
                    ? "tr-TR"
                    : language.value + "-" +
                      language.value.toUpperCase();

            utterance.rate =
                0.95;

            speechSynthesis.cancel();

            speechSynthesis.speak(
                utterance
            );

        }

    }

}


/* =========================
   ENABLE VOICE
========================= */

async function enableVoice(){

    try{

        const silentWav =
            "data:audio/wav;base64," +
            "UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";


        audio.src =
            silentWav;

        audio.volume =
            0.01;


        try{

            await audio.play();

        }catch(e){

            console.log(
                "Silent audio:",
                e
            );

        }


        audio.pause();

        audio.currentTime =
            0;

        audio.volume =
            1;


        const AC =
            window.AudioContext ||
            window.webkitAudioContext;


        if(AC){

            if(!window.zeyaContext){

                window.zeyaContext =
                    new AC();

            }


            if(
                window.zeyaContext.state ===
                "suspended"
            ){

                await window.zeyaContext.resume();

            }

        }


        voiceEnabled =
            true;


        voiceButton.textContent =
            (
                langData[
                    language.value
                ] ||
                langData.tr
            ).enabled;


        voiceButton.classList.add(
            "enabled"
        );


        status.textContent =
            (
                langData[
                    language.value
                ] ||
                langData.tr
            ).enabled;


        setTimeout(
            function(){

                status.textContent =
                    "AI Concierge";

            },
            2000
        );


    }catch(error){

        console.error(
            "VOICE ENABLE:",
            error
        );

    }

}


/* =========================
   MICROPHONE
========================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Sesli giriş bu tarayıcıda desteklenmiyor."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.lang =
        getSpeechLanguage();


    const data =
        langData[
            language.value
        ] ||
        langData.tr;


    micButton.textContent =
        "🔴";


    status.textContent =
        data.listening;


    recognition.start();


    recognition.onresult =
        function(event){

            const text =
                event.results[0][0].transcript;


            input.value =
                text;


            micButton.textContent =
                "🎙️";


            status.textContent =
                "AI Concierge";


            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                "MIC ERROR:",
                event.error
            );


            micButton.textContent =
                "🎙️";


            status.textContent =
                "AI Concierge";

        };


    recognition.onend =
        function(){

            micButton.textContent =
                "🎙️";

        };

}


/* =========================
   SPEECH LANGUAGE
========================= */

function getSpeechLanguage(){

    const languages = {

        tr:"tr-TR",

        ru:"ru-RU",

        en:"en-US",

        de:"de-DE",

        fr:"fr-FR",

        es:"es-ES",

        it:"it-IT",

        ar:"ar-SA",

        uk:"uk-UA",

        pl:"pl-PL"

    };


    return languages[
        language.value
    ] || "tr-TR";

}


/* =========================
   CLEAR
========================= */

function clearChat(){

    chat.innerHTML =
        "";

}


/* =========================
   START MESSAGE
========================= */

addMessage(
    "Merhaba! 👋 Ben Zeya, Selectum Noa Belek AI asistanınızım. Size nasıl yardımcı olabilirim?",
    "bot"
);

</script>

</body>
</html>
