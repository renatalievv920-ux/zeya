<style>

*{

html,

body{

/* =========================

========================= */

}

.logo{

    display:flex;
    align-items:center;
    gap:11px;

}

.logo-icon{

    height:48px;

    align-items:center;

   CHAT
========================= */

}

}

========================= */

.welcome-icon{

.welcome p{

    color:#aab4c8;

    line-height:1.5;

/* =========================
   MESSAGES
========================= */

.message{

    display:flex;

}

.message.user{

    justify-content:flex-end;

}

.bubble{

========================= */

    cursor:pointer;

.quick button:active{

/* =========================
   STATUS

========================= */

/* =========================

/* =========================

/* ==================================================
   CHANGE LANGUAGE
================================================== */

languageSelect.addEventListener(
    "change",
    changeLanguage
);


function changeLanguage(){

    const lang =
        languageSelect.value;

    const t =
        languages[lang] ||
        languages.ru;


    document.getElementById(
        "welcomeTitle"
    ).textContent =
        t.welcome;


    document.getElementById(
        "welcomeText"
    ).textContent =
        t.text;


    document.getElementById(
        "quickTitle"
    ).textContent =
        t.quick;


    input.placeholder =
        t.placeholder;


    if(!voiceEnabled){

        voiceEnableButton.textContent =
            t.voiceButton;

    }

}


/* ==================================================
   ADD MESSAGE
================================================== */

function addMessage(
    text,
    type
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* ==================================================
   ENABLE VOICE
================================================== */

async function enableVoice(){

    try{

        /*
         * Разблокируем AudioContext
         * для iPhone Safari
         */

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(AudioContext){

            if(
                !window.zeyaAudioContext
            ){

                window.zeyaAudioContext =
                    new AudioContext();

            }


            if(
                window.zeyaAudioContext.state
                ===
                "suspended"
            ){

                await
                    window.zeyaAudioContext
                    .resume();

            }

        }


        /*
         * Разблокируем именно
         * HTML Audio element
         */

        audioPlayer.src =
            "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";


        audioPlayer.volume =
            0.01;


        try{

            await audioPlayer.play();

            audioPlayer.pause();

            audioPlayer.currentTime =
                0;

        }catch(e){

            console.log(
                "Audio unlock:",
                e
            );

        }


        audioPlayer.volume =
            1;


        voiceEnabled =
            true;


        const lang =
            languageSelect.value;

        const t =
            languages[lang] ||
            languages.ru;


        voiceEnableButton.textContent =
            t.voiceEnabled;


        voiceEnableButton.classList.add(
            "enabled"
        );


        statusText.textContent =
            t.voiceOn;


        setTimeout(
            function(){

                statusText.textContent =
                    "";

            },
            2000
        );


    }catch(error){

        console.error(
            "Voice enable error:",
            error
        );

    }

}


/* ==================================================
   SEND MESSAGE
================================================== */

    const message =
        input.value.trim();


    const lang =
        languageSelect.value;


    const t =
        languages[lang] ||
        languages.ru;


    if(!message){

        statusText.textContent =
            t.empty;

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value =
        "";


    statusText.textContent =
        t.thinking;


    try{

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        const reply =
            data.reply ||
            "Не удалось получить ответ.";


        addMessage(
            reply,
            "zeya"
        );


        statusText.textContent =
            "";


        /*
         * Озвучиваем ответ
         */

        await speak(
            reply
        );


    }catch(error){

        console.error(
            error
        );


        statusText.textContent =
            t.error;


        addMessage(
            t.error,
            "zeya"
        );

    }

}

/* ==================================================
   OPENAI TTS
================================================== */

async function speak(
    text
){

    if(!text){
        return;
    }


    /*
     * Если пользователь ещё
     * не включил голос,
     * не пытаемся запускать
     * аудио автоматически.
     */

    if(!voiceEnabled){

        console.log(
            "Voice is not enabled yet."
        );

        return;

    }


    const language =
        languageSelect.value ||
        "ru";


    try{

        const response =
            await fetch(
                TTS_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            text:
                                text,

                            language:
                                language

                        })

                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            console.error(
                "TTS server error:",
                errorText
            );


            throw new Error(
                "TTS error"
            );

        }


        const audioBlob =
            await response.blob();


        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );


        /*
         * Останавливаем предыдущий
         * звук
         */

        try{

            audioPlayer.pause();

        }catch(e){}


        audioPlayer =
            new Audio();


        audioPlayer.preload =
            "auto";


        audioPlayer.src =
            audioUrl;


        audioPlayer.volume =
            1;


        audioPlayer.onended =
            function(){

                URL.revokeObjectURL(
                    audioUrl
                );

            };


        audioPlayer.onerror =
            function(){

                URL.revokeObjectURL(
                    audioUrl
                );

            };


        await audioPlayer.play();


    }catch(error){

        console.error(
            "OpenAI TTS error:",
            error
        );


        /*
         * Запасной голос браузера
         */

        browserSpeak(
            text
        );

    }

}


/* ==================================================
   BROWSER FALLBACK
================================================== */

function browserSpeak(
    text
){

    if(
        !(
            "speechSynthesis"
            in
            window
        )
    ){

        return;

    }


    speechSynthesis.cancel();


    const lang =
        languageSelect.value ||
        "ru";


    const langMap = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        langMap[lang] ||
        "ru-RU";


    utterance.rate =
        0.95;


    utterance.pitch =
        1.0;


    const voices =
        speechSynthesis.getVoices();


    const selectedVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                ===
                utterance.lang
                    .toLowerCase()
        );


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    speechSynthesis.speak(
        utterance
    );

}


/* ==================================================
   VOICE INPUT
================================================== */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Ваш браузер не поддерживает голосовой ввод."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    const lang =
        languageSelect.value ||
        "ru";


    const langMap = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    recognition.lang =
        langMap[lang] ||
        "ru-RU";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            const t =
                languages[lang] ||
                languages.ru;


            statusText.textContent =
                t.listening;


            voiceButton.classList.add(
                "active"
            );

        };


    recognition.onresult =
        function(event){

            const text =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                text;


            statusText.textContent =
                "";


            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                "Voice input error:",
                event.error
            );


            statusText.textContent =
                "";

        };


    recognition.onend =
        function(){

            voiceButton.classList.remove(
                "active"
            );

        };


    try{

        recognition.start();

    }catch(error){

        console.error(
            error
        );

    }

}
