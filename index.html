<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Zeya AI — Selectum Noa Belek</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06101d;
  --bg2:#0b1828;
  --card:rgba(18,34,53,.78);
  --card2:rgba(24,43,65,.9);
  --line:rgba(255,255,255,.09);
  --text:#f5f8fc;
  --muted:#91a2b7;
  --blue:#42a5ff;
  --cyan:#57e0ff;
  --green:#48d597;
  --gold:#f4c76b;
  --danger:#ff6878;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(35,122,190,.22),transparent 30%),
    radial-gradient(circle at 100% 30%,rgba(36,91,155,.16),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.container{
  width:min(100%,620px);
  margin:auto;
  padding:18px 16px 30px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:45px;
  height:45px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:linear-gradient(135deg,#168cff,#56dcff);
  box-shadow:0 8px 25px rgba(35,157,255,.25);
}

.logo-title{
  font-size:20px;
  font-weight:800;
}

.hotel-name{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.lang{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:white;
  padding:9px 10px;
  border-radius:12px;
  outline:none;
}

/* HERO */

.hero{
  background:
    linear-gradient(135deg,rgba(25,104,163,.7),rgba(8,24,42,.95)),
    url("https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=1000&q=80")
    center/cover;
  border-radius:27px;
  padding:24px 20px;
  min-height:190px;
  position:relative;
  overflow:hidden;
  margin-bottom:18px;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(4,12,22,.9),transparent);
}

.hero-content{
  position:relative;
  z-index:2;
  margin-top:55px;
}

.badge{
  display:inline-flex;
  padding:7px 10px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.12);
  border-radius:100px;
  font-size:11px;
  margin-bottom:9px;
}

.hero h1{
  font-size:27px;
  line-height:1.1;
}

.hero p{
  color:#c3d0dd;
  margin-top:7px;
  font-size:13px;
}

/* ROOM */

.room-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:18px;
  backdrop-filter:blur(15px);
}

.room-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.room-icon{
  width:42px;
  height:42px;
  background:rgba(66,165,255,.12);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.room-title{
  font-size:13px;
  color:var(--muted);
}

.room-number{
  font-size:18px;
  font-weight:800;
  margin-top:2px;
}

.status{
  color:var(--green);
  font-size:11px;
}

/* QUICK ACTIONS */

.section-title{
  font-size:17px;
  font-weight:800;
  margin:24px 0 12px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.quick{
  background:var(--card);
  border:1px solid var(--line);
  color:white;
  border-radius:17px;
  padding:15px 8px;
  min-height:80px;
  transition:.2s;
}

.quick:active{
  transform:scale(.96);
}

.quick-icon{
  font-size:24px;
  display:block;
  margin-bottom:7px;
}

.quick span{
  font-size:11px;
  color:#c6d0dc;
}

/* INFO */

.info-card{
  background:linear-gradient(135deg,rgba(27,52,77,.9),rgba(12,27,44,.9));
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-top:12px;
}

.info-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.info-head strong{
  font-size:15px;
}

.live{
  font-size:10px;
  color:var(--green);
}

.meal{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.meal:last-child{
  border-bottom:0;
}

.meal span{
  color:var(--muted);
}

/* RECOMMEND */

.recommend{
  background:
    linear-gradient(90deg,rgba(5,15,26,.95),rgba(5,15,26,.35)),
    url("https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?auto=format&fit=crop&w=1000&q=80")
    center/cover;
  min-height:160px;
  border-radius:21px;
  padding:19px;
  display:flex;
  flex-direction:column;
  justify-content:end;
  margin-top:12px;
}

.recommend small{
  color:var(--cyan);
  font-weight:700;
}

.recommend h3{
  margin:5px 0;
}

.recommend p{
  color:#c1ccd8;
  font-size:12px;
}

/* SERVICE CARDS */

.service-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.service{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  text-align:left;
  color:white;
}

.service-icon{
  font-size:25px;
  margin-bottom:10px;
}

.service strong{
  display:block;
  font-size:13px;
}

.service small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  line-height:1.35;
}

/* CHAT */

.chat-box{
  background:rgba(7,18,30,.8);
  border:1px solid var(--line);
  border-radius:22px;
  margin-top:12px;
  padding:13px;
  min-height:160px;
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:12px;
}

.avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:11px;
  background:linear-gradient(135deg,#168cff,#56dcff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.bubble{
  background:var(--card2);
  border-radius:14px;
  padding:10px 12px;
  font-size:13px;
  line-height:1.4;
  max-width:85%;
}

.user{
  justify-content:flex-end;
}

.user .bubble{
  background:#1678c8;
}

/* INPUT */

.chat-input{
  position:fixed;
  bottom:64px;
  left:50%;
  transform:translateX(-50%);
  width:min(100%,620px);
  padding:9px 12px;
  z-index:30;
  background:rgba(4,13,23,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}

.input-wrap{
  display:flex;
  gap:7px;
}

.input-wrap input{
  flex:1;
  background:#122235;
  border:1px solid var(--line);
  color:white;
  border-radius:15px;
  padding:13px;
  outline:none;
}

.input-wrap button{
  width:45px;
  border-radius:14px;
  background:#168cff;
  color:white;
  font-size:18px;
}

.mic{
  background:#1c3046 !important;
}

.mic.active{
  background:#d94d63 !important;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(100%,620px);
  height:64px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(6,15,26,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
  z-index:40;
}

.nav-item{
  color:#718196;
  font-size:10px;
  text-align:center;
  background:none;
}

.nav-item div{
  font-size:20px;
  margin-bottom:2px;
}

.nav-item.active{
  color:#58baff;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(100%,620px);
  max-height:88vh;
  overflow:auto;
  background:#0b1929;
  border-radius:27px 27px 0 0;
  padding:22px 17px 35px;
  border-top:1px solid var(--line);
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#182b40;
  color:white;
  font-size:18px;
}

.modal-item{
  background:var(--card);
  border:1px solid var(--line);
  padding:15px;
  border-radius:17px;
  margin-bottom:9px;
}

.modal-item strong{
  display:block;
  font-size:14px;
}

.modal-item span{
  color:var(--muted);
  display:block;
  font-size:12px;
  margin-top:5px;
}

.modal-btn{
  width:100%;
  background:#168cff;
  color:white;
  padding:13px;
  border-radius:13px;
  margin-top:11px;
  font-weight:700;
}

.note{
  color:#718196;
  font-size:10px;
  line-height:1.5;
  margin-top:15px;
}

/* TOAST */

.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translate(-50%,-130px);
  background:#152b42;
  border:1px solid var(--line);
  padding:12px 17px;
  border-radius:14px;
  z-index:200;
  font-size:12px;
  transition:.3s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* DESKTOP */

@media(min-width:700px){
  .container{
    padding-top:30px;
  }

  .hero{
    min-height:220px;
  }

  .quick-grid{
    grid-template-columns:repeat(6,1fr);
  }

  .quick{
    min-height:95px;
  }
}
</style>
</head>
