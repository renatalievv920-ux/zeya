<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Зея — AI помощник</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top,#18294b 0%,#080d19 45%,#05070d 100%);
    color:white;
}

.app{
    width:100%;
    max-width:850px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,18,.75);
    backdrop-filter:blur(15px);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:linear-gradient(135deg,#6c63ff,#9c6cff);
    box-shadow:0 0 25px rgba(108,99,255,.35);
}

.logo-text{
    font-size:20px;
    font-weight:bold;
}

.logo-sub{
    font-size:12px;
    color:#9ba6bd;
    margin-top:3px;
}

.language{
    background:#111a2d;
    color:white;
    border:1px solid #273653;
    border-radius:10px;
    padding:9px 10px;
    outline:none;
}

/* CHAT */

.chat{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

.welcome{
    text-align:center;
    padding:25px 10px 20px;
}

.welcome-icon{
    font-size:55px;
    margin-bottom:10px;
}

.welcome h1{
    margin:0;
    font-size:28px;
}

.welcome p{
    color:#aab4c8;
    line-height:1.5;
}

/* MESSAGES */

.message{
    display:flex;
    margin:14px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:82%;
    padding:13px 16px;
    border-radius:18px;
    line-height:1.5;
    white-space:pre-wrap;
}

.message.zeya .bubble{
    background:#151f34;
    border:1px solid #263653;
    border-bottom-left-radius:5px;
}

.message.user .bubble{
    background:linear-gradient(135deg,#635bff,#7e68ff);
    border-bottom-right-radius:5px;
}

/* QUICK BUTTONS */

.quick-title{
    color:#929db3;
    font-size:13px;
    margin:5px 0 10px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.quick button{
    background:#111a2d;
    color:#e9edff;
    border:1px solid #263653;
    padding:13px 10px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
}

.quick button:hover{
    background:#1b2944;
    transform:translateY(-1px);
}

/* STATUS */

.status{
    min-height:24px;
    padding:0 20px 5px;
    color:#929db3;
    font-size:13px;
}

/* INPUT */

.bottom{
    padding:12px 15px 18px;
    background:rgba(5,8,18,.9);
    border-top:1px solid rgba(255,255,255,.07);
}

.input-row{
    display:flex;
    gap:8px;
}

.input{
    flex:1;
    min-width:0;
    background:#111a2d;
    color:white;
    border:1px solid #2a3956;
    border-radius:15px;
    padding:14px;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#7168ff;
}

.icon-button,
.send-button{
    border:none;
    border-radius:14px;
    cursor:pointer;
    color:white;
}

.icon-button{
    width:50px;
    background:#17223a;
    font-size:20px;
}

.send-button{
    width:55px;
    background:linear-gradient(135deg,#635bff,#816aff);
    font-size:20px;
}

.icon-button.active{
    background:#d93855;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.06);
    }
}

.clear{
    text-align:center;
    margin-top:10px;
}

.clear button{
    background:none;
    border:none;
    color:#6f7b92;
    cursor:pointer;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:12px;
    }

    .chat{
        padding:14px;
    }

    .bubble{
        max-width:90%;
    }

    .welcome h1{
        font-size:24px;
    }

    .quick{
        grid-template-columns:repeat(2,1fr);
    }

    .input{
        font-size:15px;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <div class="logo-icon">
                ✨
            </div>

            <div>
                <div class="logo-text">
                    Зея AI

            </div>

        </div>


        <select id="languageSelect" class="language">

            <option value="ru">🇷🇺 Русский</option>
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="en">🇬🇧 English</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="uk">🇺🇦 Українська</option>
            <option value="pl">🇵🇱 Polski</option>

        </select>

    </div>


    <!-- CHAT -->

    <div id="chat" class="chat">

        <div class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h1 id="welcomeTitle">
                Привет! Я Зея
            </h1>

            <p id="welcomeText">
                Ваш AI-консьерж. Я помогу с отелем,
                ресторанами, трансфером, экскурсиями
                и путешествиями.
            </p>

        </div>


        <div class="quick-title" id="quickTitle">
            Быстрые вопросы
        </div>


        <div class="quick">

            <button onclick="quickQuestion('Во сколько завтрак?')">
                🍳 Завтрак
            </button>

            <button onclick="quickQuestion('Какие рестораны есть в отеле?')">
                🍽️ Рестораны
            </button>

            <button onclick="quickQuestion('Где находится бассейн?')">
                🏊 Бассейн
            </button>

            <button onclick="quickQuestion('Можно заказать трансфер?')">
                🚕 Трансфер
            </button>

            <button onclick="quickQuestion('Какие экскурсии доступны?')">
                🚌 Экскурсии
            </button>

            <button onclick="quickQuestion('Что можно посмотреть рядом с отелем?')">
                📍 Рядом
            </button>

        </div>

    </div>


    <!-- STATUS -->

    <div id="status" class="status"></div>


    <!-- INPUT -->

    <div class="bottom">

        <div class="input-row">

            <input
                id="input"
                class="input"
                type="text"
                placeholder="Напишите сообщение..."
                autocomplete="off"
            >

            <button
                id="voiceButton"
                class="icon-button"
                onclick="startVoice()"
                title="Голосовой ввод"
            >
                🎙️
            </button>

            <button
                class="send-button"
                onclick="sendMessage()"
                title="Отправить"
            >
                ➤
            </button>

        </div>


        <div class="clear">

            <button onclick="clearChat()">
                🗑️ Очистить чат
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   НАСТРОЙКИ
========================= */

const API_URL =
    "https://zeya-pi.vercel.app/api/chat";

const TTS_URL =
    "https://zeya-pi.vercel.app/api/tts";


/* =========================
   ELEMENTS
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const statusText =
    document.getElementById("status");

const voiceButton =
    document.getElementById("voiceButton");

const languageSelect =
    document.getElementById("languageSelect");


/* =========================
   ЯЗЫКИ
========================= */

const languages = {

    ru:{
        welcome:"Привет! Я Зея",
        text:"Ваш AI-консьерж. Я помогу с отелем, ресторанами, трансфером, экскурсиями и путешествиями.",
        placeholder:"Напишите сообщение...",
        quick:"Быстрые вопросы",
        thinking:"Зея думает... 🤖",
        listening:"🔴 Слушаю тебя...",
        error:"Произошла ошибка. Попробуйте ещё раз.",
        empty:"Напишите сообщение."
    },

    tr:{
        welcome:"Merhaba! Ben Zeya",
        text:"Otel, restoranlar, transfer, geziler ve seyahat konusunda size yardımcı olan AI asistanınızım.",
        placeholder:"Mesajınızı yazın...",
        quick:"Hızlı sorular",
        thinking:"Zeya düşünüyor... 🤖",
        listening:"🔴 Seni dinliyorum...",
        error:"Bir hata oluştu. Lütfen tekrar deneyin.",
        empty:"Bir mesaj yazın."
    },

    en:{
        welcome:"Hello! I'm Zeya",
        text:"Your AI concierge. I can help with the hotel, restaurants, transfers, excursions and travel.",
        placeholder:"Write a message...",
        quick:"Quick questions",
        thinking:"Zeya is thinking... 🤖",
        listening:"🔴 I'm listening...",
        error:"Something went wrong. Please try again.",
        empty:"Write a message."
    },

    de:{
        welcome:"Hallo! Ich bin Zeya",
        text:"Ihre AI-Concierge. Ich helfe Ihnen mit dem Hotel, Restaurants, Transfers und Ausflügen.",
        placeholder:"Nachricht schreiben...",
        quick:"Schnelle Fragen",
        thinking:"Zeya denkt nach... 🤖",
        listening:"🔴 Ich höre zu...",
        error:"Ein Fehler ist aufgetreten.",
        empty:"Schreiben Sie eine Nachricht."
    },

    fr:{
        welcome:"Bonjour ! Je suis Zeya",
        text:"Votre concierge IA. Je peux vous aider avec l'hôtel, les restaurants, les transferts et les excursions.",
        placeholder:"Écrivez un message...",
        quick:"Questions rapides",
        thinking:"Zeya réfléchit... 🤖",
        listening:"🔴 Je vous écoute...",
        error:"Une erreur est survenue.",
        empty:"Écrivez un message."
    },

    es:{
        welcome:"¡Hola! Soy Zeya",
        text:"Tu conserje de IA. Puedo ayudarte con el hotel, restaurantes, traslados y excursiones.",
        placeholder:"Escribe un mensaje...",
        quick:"Preguntas rápidas",
        thinking:"Zeya está pensando... 🤖",
        listening:"🔴 Te escucho...",
        error:"Ha ocurrido un error.",
        empty:"Escribe un mensaje."
    },

    it:{
        welcome:"Ciao! Sono Zeya",
        text:"La tua concierge AI. Posso aiutarti con hotel, ristoranti, trasferimenti ed escursioni.",
        placeholder:"Scrivi un messaggio...",
        quick:"Domande rapide",
        thinking:"Zeya sta pensando... 🤖",
        listening:"🔴 Ti ascolto...",
        error:"Si è verificato un errore.",
        empty:"Scrivi un messaggio."
    },

    ar:{
        welcome:"مرحباً! أنا زيا",
        text:"مساعدك الذكي للفندق والمطاعم والتنقل والرحلات والسفر.",
        placeholder:"اكتب رسالتك...",
        quick:"أسئلة سريعة",
        thinking:"زيا تفكر... 🤖",
        listening:"🔴 أنا أستمع...",
        error:"حدث خطأ.",
        empty:"اكتب رسالة."
    },

    uk:{
        welcome:"Привіт! Я Зея",
        text:"Ваш AI-консьєр. Я допоможу з готелем, ресторанами, трансфером та екскурсіями.",
        placeholder:"Напишіть повідомлення...",
        quick:"Швидкі запитання",
        thinking:"Зея думає... 🤖",
        listening:"🔴 Я слухаю...",
        error:"Сталася помилка.",
        empty:"Напишіть повідомлення."
    },

    pl:{
        welcome:"Cześć! Jestem Zeya",
        text:"Twój AI concierge. Pomogę z hotelem, restauracjami, transferami i wycieczkami.",
        placeholder:"Napisz wiadomość...",
        quick:"Szybkie pytania",
        thinking:"Zeya myśli... 🤖",
        listening:"🔴 Słucham...",
        error:"Wystąpił błąd.",
        empty:"Napisz wiadomość."
    }

};


/* =========================
   LANGUAGE CHANGE
========================= */

languageSelect.addEventListener(
    "change",
    changeLanguage
);


function changeLanguage(){

    const lang =
        languageSelect.value;

    const t =
        languages[lang] || languages.ru;

    document.getElementById(
        "welcomeTitle"
    ).textContent = t.welcome;

    document.getElementById(
        "welcomeText"
    ).textContent = t.text;

    document.getElementById(
        "quickTitle"
    ).textContent = t.quick;

    input.placeholder =
        t.placeholder;

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const message =
        input.value.trim();

    const lang =
        languageSelect.value;

    const t =
        languages[lang] || languages.ru;


    if(!message){

        statusText.textContent =
            t.empty;

        return;
    }


    addMessage(
        message,
        "user"
    );

    input.value = "";

    statusText.textContent =
        t.thinking;


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:message
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        const reply =
            data.reply ||
            "Не удалось получить ответ.";


        addMessage(
            reply,
            "zeya"
        );


        statusText.textContent = "";


        /* НОВЫЙ ГОЛОС */

        await speak(reply);


    }catch(error){

        console.error(error);

        statusText.textContent =
            t.error;

        addMessage(
            t.error,
            "zeya"
        );

    }

}


/* =========================
   QUICK QUESTION
========================= */

function quickQuestion(question){

    input.value =
        question;

    sendMessage();

}


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   OPENAI TTS
========================= */

async function speak(text){

    if(!text){
        return;
    }


    const language =
        languageSelect.value || "ru";


    try{

        const response =
            await fetch(
                TTS_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        text:text,

                        language:language

                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            console.error(
                "TTS server error:",
                errorText
            );

            throw new Error(
                "TTS error"
            );

        }


        const audioBlob =
            await response.blob();


        const audioUrl =
            URL.createObjectURL(
                audioBlob
            );


        const audio =
            new Audio(audioUrl);


        audio.onended =
            function(){

                URL.revokeObjectURL(
                    audioUrl
                );

            };


        audio.onerror =
            function(){

                URL.revokeObjectURL(
                    audioUrl
                );

            };


        await audio.play();


    }catch(error){

        console.error(
            "OpenAI TTS error:",
            error
        );


        /*
           ЕСЛИ OPENAI TTS НЕ СРАБОТАЛ,
           ИСПОЛЬЗУЕМ ГОЛОС БРАУЗЕРА
        */

        browserSpeak(text);

    }

}


/* =========================
   BROWSER FALLBACK VOICE
========================= */

function browserSpeak(text){

    if(!("speechSynthesis" in window)){
        return;
    }


    speechSynthesis.cancel();


    const lang =
        languageSelect.value || "ru";


    const langMap = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        langMap[lang] || "ru-RU";


    utterance.rate =
        0.95;

    utterance.pitch =
        1.0;


    const voices =
        speechSynthesis.getVoices();


    const selectedVoice =
        voices.find(
            voice =>
                voice.lang.toLowerCase()
                ===
                utterance.lang.toLowerCase()
        );


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    speechSynthesis.speak(
        utterance
    );

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Ваш браузер не поддерживает голосовой ввод."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    const lang =
        languageSelect.value || "ru";


    const langMap = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    recognition.lang =
        langMap[lang] || "ru-RU";


    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            const t =
                languages[lang] || languages.ru;

            statusText.textContent =
                t.listening;

            voiceButton.classList.add(
                "active"
            );

        };


    recognition.onresult =
        function(event){

            const text =
                event.results[0][0].transcript;

            input.value =
                text;

            statusText.textContent = "";

            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                "Voice error:",
                event.error
            );

            statusText.textContent =
                "";

        };


    recognition.onend =
        function(){

            voiceButton.classList.remove(
                "active"
            );

        };


    recognition.start();

}


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

    chat.innerHTML = `

        <div class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h1 id="welcomeTitle">
                ${languages[
                    languageSelect.value
                ].welcome}
            </h1>

            <p id="welcomeText">
                ${languages[
                    languageSelect.value
                ].text}
            </p>

        </div>

        <div class="quick-title" id="quickTitle">
            ${languages[
                languageSelect.value
            ].quick}
        </div>

        <div class="quick">

            <button onclick="quickQuestion('Во сколько завтрак?')">
                🍳 Завтрак
            </button>

            <button onclick="quickQuestion('Какие рестораны есть в отеле?')">
                🍽️ Рестораны
            </button>

            <button onclick="quickQuestion('Где находится бассейн?')">
                🏊 Бассейн
            </button>

            <button onclick="quickQuestion('Можно заказать трансфер?')">
                🚕 Трансфер
            </button>

            <button onclick="quickQuestion('Какие экскурсии доступны?')">
                🚌 Экскурсии
            </button>

            <button onclick="quickQuestion('Что можно посмотреть рядом с отелем?')">
                📍 Рядом
            </button>

        </div>

    `;

    statusText.textContent = "";

}


/* =========================
   LOAD
========================= */

changeLanguage();

</script>
