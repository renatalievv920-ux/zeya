<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Зея AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#050914;
    color:white;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:850px;
    height:100vh;
    height:100dvh;
    margin:auto;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    flex-shrink:0;
    padding:14px 14px 12px;
    padding-top:max(14px,env(safe-area-inset-top));

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(7,11,24,.96);
    border-bottom:1px solid #202b43;

    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    background:linear-gradient(
        135deg,
        #695dff,
        #a06aff
    );

    box-shadow:0 0 25px rgba(100,90,255,.4);
}

.logo-name{
    font-size:21px;
    font-weight:700;
}

.logo-sub{
    margin-top:3px;
    color:#8995ad;
    font-size:12px;
}

.language{
    background:#111a2d;
    color:white;
    border:1px solid #293957;
    border-radius:12px;
    padding:10px;
    font-size:14px;
    outline:none;
    max-width:145px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px 13px 20px;

    -webkit-overflow-scrolling:touch;
}

.welcome{
    text-align:center;
    padding:25px 10px 18px;
}

.robot{
    font-size:52px;
}

.welcome h1{
    margin:8px 0 0;
    font-size:26px;
}

.welcome p{
    color:#9da9bf;
    line-height:1.5;
    margin:10px auto;
    max-width:650px;
}

/* MESSAGES */

.message{
    display:flex;
    margin:13px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:90%;
    padding:13px 16px;
    border-radius:18px;
    line-height:1.5;
    font-size:16px;
    white-space:pre-wrap;
    word-break:break-word;
}

.message.zeya .bubble{
    background:#141f34;
    border:1px solid #293957;
    border-bottom-left-radius:5px;
}

.message.user .bubble{
    background:linear-gradient(
        135deg,
        #6258ff,
        #8068ff
    );
    border-bottom-right-radius:5px;
}

/* QUICK */

.quick-title{
    color:#8d99b0;
    font-size:13px;
    margin:5px 0 9px;
}

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.quick button{
    min-height:47px;
    padding:9px;

    border-radius:13px;

    background:#10192c;
    color:#e8ecff;

    border:1px solid #293957;

    font-size:14px;
}

.quick button:active{
    transform:scale(.98);
}

/* STATUS */

.status{
    flex-shrink:0;
    min-height:23px;
    padding:0 15px 5px;
    color:#8f9ab1;
    font-size:13px;
}

/* BOTTOM */

.bottom{
    flex-shrink:0;

    padding:
        8px
        12px
        max(12px,env(safe-area-inset-bottom))
        12px;

    background:#060a16;

    border-top:1px solid #1c273d;
}

/* VOICE */

.voice-enable{
    width:100%;

    height:43px;

    margin-bottom:9px;

    border-radius:12px;

    border:1px solid #394b70;

    background:#111a2d;

    color:#e9edff;

    font-size:14px;
    font-weight:600;
}

.voice-enable.enabled{
    background:#172344;
    border-color:#6c63ff;
}

/* INPUT */

.input-row{
    display:flex;
    gap:8px;
}

.input{
    flex:1;
    min-width:0;

    height:55px;

    background:#111a2d;
    color:white;

    border:1px solid #2a3956;
    border-radius:15px;

    padding:0 14px;

    font-size:16px;
    outline:none;
}

.input::placeholder{
    color:#71809a;
}

.input:focus{
    border-color:#7067ff;
}

.mic{
    width:55px;
    height:55px;

    border:0;
    border-radius:15px;

    background:#17233e;
    color:white;

    font-size:21px;
}

.mic.active{
    background:#d93855;
    animation:pulse 1s infinite;
}

.send{
    width:55px;
    height:55px;

    border:0;
    border-radius:15px;

    background:linear-gradient(
        135deg,
        #6258ff,
        #8068ff
    );

    color:white;

    font-size:21px;
}

@keyframes pulse{
    50%{
        transform:scale(1.06);
    }
}

/* CLEAR */

.clear{
    text-align:center;
    margin-top:8px;
}

.clear button{
    background:none;
    border:0;
    color:#6f7b91;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding-left:12px;
        padding-right:12px;
    }

    .logo-icon{
        width:44px;
        height:44px;
        font-size:24px;
    }

    .logo-name{
        font-size:19px;
    }

    .language{
        max-width:140px;
    }

    .bubble{
        max-width:92%;
    }

}

</style>
</head>

</div>

<script>


/* ==========================================
   API
========================================== */

const API_URL =

const TTS_URL =
    "https://zeya-pi.vercel.app/api/tts";


/* ==========================================

========================================== */

const chat =

const input =

const status =

const language =

const mic =

const voiceEnable =

/* ==========================================
   AUDIO
========================================== */

let voiceEnabled = false;

let audio =
    new Audio();

audio.preload =
    "auto";


/* ==========================================

========================================== */

const langData = {

    },

        placeholder:"Mesajınızı yazın...",

        thinking:"Zeya düşünüyor... 🤖",
        listening:"🔴 Seni dinliyorum...",
        enabled:"🔊 Zeya'nın sesi açık",
        enable:"🔊 Zeya'nın sesini aç",
        error:"Bir hata oluştu. Lütfen tekrar deneyin."
    },

    en:{
        welcome:"Hello! I'm Zeya 😊",
        text:"Your AI concierge. I can help with hotels, restaurants, transfers, excursions and travel.",
        placeholder:"Write a message...",
        quick:"Quick questions",
        thinking:"Zeya is thinking... 🤖",

        enabled:"🔊 Zeya voice is on",
        enable:"🔊 Enable Zeya voice",
        error:"Something went wrong."
    },

    de:{
        welcome:"Hallo! Ich bin Zeya 😊",
        text:"Ihre AI-Concierge. Ich helfe Ihnen mit Hotels, Restaurants, Transfers und Ausflügen.",
        placeholder:"Nachricht schreiben...",
        quick:"Schnelle Fragen",
        thinking:"Zeya denkt nach... 🤖",
        listening:"🔴 Ich höre zu...",
        enabled:"🔊 Stimme aktiviert",
        enable:"🔊 Stimme aktivieren",
        error:"Ein Fehler ist aufgetreten."
    },

    fr:{
        welcome:"Bonjour ! Je suis Zeya 😊",
        text:"Votre concierge IA. Je peux vous aider avec l'hôtel, les restaurants, les transferts et les excursions.",
        placeholder:"Écrivez un message...",

        listening:"🔴 Je vous écoute...",
        enabled:"🔊 Voix activée",
        enable:"🔊 Activer la voix",
        error:"Une erreur est survenue."
    },

    es:{
        welcome:"¡Hola! Soy Zeya 😊",
        text:"Tu conserje de IA. Puedo ayudarte con hoteles, restaurantes, traslados y excursiones.",
        placeholder:"Escribe un mensaje...",
        quick:"Preguntas rápidas",

    it:{

        placeholder:"Scrivi un messaggio...",

    },

    ar:{
        welcome:"مرحباً! أنا زيا 😊",
        text:"مساعدك الذكي للفندق والمطاعم والتنقل والرحلات والسفر.",
        placeholder:"اكتب رسالتك...",

        listening:"🔴 أنا أستمع...",
        enabled:"🔊 تم تشغيل الصوت",

    },

    uk:{
        welcome:"Привіт! Я Зея 😊",
        text:"Ваш AI-консьєр. Я допоможу з готелем, ресторанами, трансфером та екскурсіями.",
        placeholder:"Напишіть повідомлення...",
        quick:"Швидкі запитання",

};


/* ==========================================
   LANGUAGE
========================================== */

function updateLanguage(){

    const l =
        langData[language.value] ||
        langData.ru;

    document.getElementById(
        "welcomeTitle"
    ).textContent =
        l.welcome;

    document.getElementById(
        "welcomeText"
    ).textContent =
        l.text;

    document.getElementById(
        "quickTitle"
    ).textContent =
        l.quick;

    input.placeholder =
        l.placeholder;

    if(!voiceEnabled){

        voiceEnable.textContent =
            l.enable;

    }else{

        voiceEnable.textContent =
            l.enabled;

    }

}

language.addEventListener(
    "change",
    updateLanguage
);


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(
    text,
    type
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* ==========================================
   ENABLE VOICE
========================================== */

async function enableVoice(){

    try{

        /*
         * iPhone Safari требует,
         * чтобы первое audio.play()
         * произошло внутри нажатия пользователя.
         */

        const silentWav =
            "data:audio/wav;base64," +
            "UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";


        audio.src =
            silentWav;

        audio.volume =
            0.01;


        try{

            await audio.play();

        }catch(e){

            console.log(
                "Silent audio:",
                e
            );

        }


        audio.pause();

        audio.currentTime =
            0;

        audio.volume =
            1;


        /*
         * AudioContext
         */

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;


        if(AC){

            if(!window.zeyaContext){

                window.zeyaContext =
                    new AC();

            }


            if(
                window.zeyaContext.state
                ===
                "suspended"
            ){

                await
                    window.zeyaContext
                    .resume();

            }

        }


        voiceEnabled =
            true;


        voiceEnable.textContent =
            (
                langData[
                    language.value
                ] || langData.ru
            ).enabled;


        voiceEnable.classList.add(
            "enabled"
        );


        status.textContent =
            (
                langData[
                    language.value
                ] || langData.ru
            ).enabled;


        setTimeout(
            function(){

                status.textContent =
                    "";

            },
            2000
        );


    }catch(error){

        console.error(
            "VOICE ENABLE:",
            error
        );

    }

}


/* ==========================================
   SEND
========================================== */

async function sendMessage(){

    const message =
        input.value.trim();


    const l =
        langData[
            language.value
        ] || langData.ru;


    if(!message){

        status.textContent =
            "Напишите сообщение.";

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value =
        "";


    status.textContent =
        l.thinking;


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:message
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "API error"
            );

        }


        const reply =
            data.reply ||
            "Не удалось получить ответ.";


        addMessage(
            reply,
            "zeya"
        );


        status.textContent =
            "";


        await speak(
            reply
        );


    }catch(error){

        console.error(
            error
        );


        status.textContent =
            l.error;


        addMessage(
            l.error,
            "zeya"
        );

    }

}


/* ==========================================
   TTS
========================================== */

async function speak(
    text
){

    if(!text){
        return;
    }


    if(!voiceEnabled){

        console.log(
            "Голос ещё не включён."
        );

        return;

    }


    try{

        const response =
            await fetch(
                TTS_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            text:text,

                            language:
                                language.value

                        })

                }
            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(
                "TTS ERROR:",
                error
            );

            throw new Error(
                "TTS server error"
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(
                blob
            );


        /*
         * Останавливаем предыдущий звук
         */

        audio.pause();

        audio.currentTime =
            0;


        audio.src =
            url;

        audio.volume =
            1;


        audio.onended =
            function(){

                URL.revokeObjectURL(
                    url
                );

            };


        audio.onerror =
            function(){

                URL.revokeObjectURL(
                    url
                );

            };


        await audio.play();


    }catch(error){

        console.error(
            "TTS:",
            error
        );


        /*
         * Запасной голос браузера
         */

        browserSpeak(
            text
        );

    }

}


/* ==========================================
   BROWSER VOICE
========================================== */

function browserSpeak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const map = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        map[
            language.value
        ] || "ru-RU";


    utterance.rate =
        0.95;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* ==========================================
   QUICK
========================================== */

function quick(
    text
){

    input.value =
        text;

    sendMessage();

}


/* ==========================================
   ENTER
========================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==========================================
   VOICE INPUT
========================================== */

function startVoice(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!Recognition){

        alert(
            "Голосовой ввод не поддерживается этим браузером."
        );

        return;

    }


    const recognition =
        new Recognition();


    const map = {

        ru:"ru-RU",
        tr:"tr-TR",
        en:"en-US",
        de:"de-DE",
        fr:"fr-FR",
        es:"es-ES",
        it:"it-IT",
        ar:"ar-SA",
        uk:"uk-UA",
        pl:"pl-PL"

    };


    recognition.lang =
        map[
            language.value
        ] || "ru-RU";


    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            const l =
                langData[
                    language.value
                ] || langData.ru;


            status.textContent =
                l.listening;


            mic.classList.add(
                "active"
            );

        };


    recognition.onresult =
        function(event){

            const text =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                text;


            status.textContent =
                "";


            sendMessage();

        };


    recognition.onerror =
        function(event){

            console.error(
                "MIC:",
                event.error
            );

            status.textContent =
                "";

        };


    recognition.onend =
        function(){

            mic.classList.remove(
                "active"
            );

        };


    try{

        recognition.start();

    }catch(error){

        console.error(
            error
        );

    }

}
